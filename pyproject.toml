[project]
name = "mantid-python-script-lsp"
version = "1.0.0"
description = "Mantid-aware Python analysis for the FIA script editors"
readme = "README.md"
# Not a preference: the interpreter has to be the one in the runner image (Mantid 7.0.0 ships
# 3.13), because "does this script make sense" is answered by that interpreter and its packages.
requires-python = ">= 3.13"
dependencies = [
    "fastapi==0.162.2",
    "pydantic==2.14.3",
    "uvicorn[standard]==0.54.0",
    "jedi==0.20.1",
    "pyflakes==4.1.0",
]

[project.urls]
"Repository" = "https://github.com/fiaisis/mantid-python-script-lsp"

[project.optional-dependencies]
formatting = [
    "ruff==0.17.4",
    "mypy==2.4.1",
    "mantid-python-script-lsp[test]",
]

test = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "pytest-random-order==1.2.0",
    "pytest-env==1.8.5",
    "httpx==0.28.1",
]

all = [
    "mantid-python-script-lsp[formatting]",
    "mantid-python-script-lsp[test]",
]

[tool.setuptools]
packages = ["script_lsp"]

[tool.ruff]
line-length = 120
# Generated by spike/make_corpus.py from live FIA scripts. It is input to a benchmark, not our code:
# linting it would report problems in facility analysis code, and formatting it would rewrite the very
# scripts we are measuring. Ruff honours .gitignore, but this holds even when the tree is not a checkout
# (e.g. mounted read-only into a container).
extend-exclude = ["spike/corpus"]

[tool.ruff.lint]
select = [
    "F", # flake8 - Basic initial rules
    "E", # pycodestyle (Error) - pep8 compliance
    "W", # pycodestyle (Warning) - pep8 compliance
    "C90", # mccabe - flags extremely complex functions
    "I", # isort - Sort imports and flag missing imports
    "N", # pep8-naming - Ensures pep8 compliance for naming
    "UP", # pyupgrade - Automatically upgrade syntax for newer versions
    "S", # flake8-bandit - Flake8 security
    "B", # flake8-bugbear - Finding likely bugs and design problems
    "A", # flake8-builtins - Finds code shadowing builtins
    "COM", # flake8-commas - Find and fixes issues with commas in lists/dicts
    "C4", # flake8-comprehensions - Simplify list/dict comprehension
    "DTZ", # flake8-datetimez - Ensure timezones are enforced for code
    "EXE", # flake8-executable - Fix issues around shebangs and executable files
    "ISC", # flake8-implicit-str-concat - Find implicitly concatenated strings
    "LOG", # flake8-logging - Enforce basic rules with builtin logger
    "T20", # flake8-print - Remove print statements
    "PT", # flake8-pytest-style - Fix issues with pytest
    "Q", # flake8-quotes - Bad quote handling
    "RET", # flake8-return - Fix issues with return values
    "SIM", # flake8-simplify - Simplify parts of the code
    "TCH", # flake8-type-checking - Move imports only for typing behind TYPE_CHECKING
    "PTH", # flake8-use-pathlib - Replace os with pathlib
    "TD", # flake8-todos - Enforce basic TODOs
    "FIX", # flake8-fix me - Resolve the issue instead of a fix me
    "ERA", # eradicate - Remove commented out code.
    "PL", "C", "E", "R", "W", # Pylint - does a lot
    "FLY", # flynt - prefer f string over .format
    "PERF", # Perflint - Flag performance antipatterns
    "RUF", # Ruff specific rules
    "FAST", # FastAPI rules
]
ignore = [
    "S101", # flake8-bandit - Use of assert (all over pytest tests)
    "ISC001", # Conflicts with the formatter
    "COM812", # Conflicts with the formatter
    "TC003", # Conflicts with pydantic
    "TC002", # Conflicts with pydantic
    "TC001", # Conflicts with pydantic
]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.per-file-ignores]
# Mantid exists only inside the runner image, so importing it at module level would make the package
# unimportable - and the unit tests unrunnable - on a dev machine or in CI's plain Python job.
"script_lsp/warmup.py" = ["PLC0415"]
# The spike exists to report measurements to a human on stdout, and to import things in a deliberate
# order (syntax cost before Mantid is imported, then after), which a top-level-imports rule forbids.
"spike/*.py" = ["T20", "PTH", "PLC0415", "S403", "S603", "S607"]
# An assertion should read as the expectation it is: `status_code == 200` says more than a named
# constant would, and a renamed literal is one more thing to get wrong in a test.
"test/*.py" = ["PLR2004"]

[tool.pytest.ini_options]
required_plugins = "pytest-random-order"
testpaths = ["test"]
