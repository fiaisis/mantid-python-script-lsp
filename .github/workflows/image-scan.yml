---
name: Image Scan

# Nightly rather than per-push: the base image is Mantid's, so the vulnerabilities found here are mostly
# whoever else's Debian packages are, on a schedule that catches them becoming public. A failing scan
# uploads SARIF to the Security tab instead of silently passing.

on:
  schedule:
    - cron: "49 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}

jobs:
  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          file: ./container/mantid_python_script_lsp.D
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mantid-python-script-lsp:${{ github.sha }}
          push: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mantid-python-script-lsp:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          exit-code: 1

      - name: Print results
        run: cat trivy-results.sarif
        if: failure()

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@f3bbb05694c2f74569081c28664dec21 # v4.39.3
        if: failure()
        with:
          sarif_file: trivy-results.sarif
