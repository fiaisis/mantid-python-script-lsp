[mypy]
strict = True

# Mantid is a C++ extension with no shipped stubs, and pyflakes has none either. Both are imported
# only inside functions that the unit tests replace, so this hides nothing we would otherwise check.
[mypy-mantid.*]
ignore_missing_imports = True

[mypy-pyflakes.*]
ignore_missing_imports = True

# jedi carries inline annotations but no py.typed marker, so mypy still treats it as untyped. Its shape
# is named once, as a Protocol in positions.py, and cast to there rather than assumed everywhere.
[mypy-jedi.*]
ignore_missing_imports = True
